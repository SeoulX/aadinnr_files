input {
  # File input for log files
  file {
    path => "/var/log/*.log"
    type => "system"
    start_position => "beginning"
  }
  
  # Beats input for filebeat
  beats {
    port => 5044
  }
  
  # TCP input for applications
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # HTTP input for webhooks
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Parse common log formats
  if [type] == "system" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:timestamp} %{IPORHOST:host} %{PROG:program}: %{GREEDYDATA:message}" }
    }
  }
  
  # Parse Apache/Nginx logs
  if [type] == "apache" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
  }
  
  # Add timestamp
  date {
    match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "timestamp" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
  
  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}
