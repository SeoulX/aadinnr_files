apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mongodb.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mongodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mongodb.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mongodb.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.init.enabled }}
        - name: init-replica-set
          image: "{{ .Values.init.image.repository }}:{{ .Values.init.image.tag }}"
          imagePullPolicy: {{ .Values.init.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              # Wait for MongoDB to be ready
              until mongosh --host {{ include "mongodb.fullname" . }}-0.{{ include "mongodb.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:27017 --eval "print('MongoDB is ready')" --quiet; do
                echo "Waiting for MongoDB to be ready..."
                sleep 5
              done
              
              # Initialize replica set
              mongosh --host {{ include "mongodb.fullname" . }}-0.{{ include "mongodb.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:27017 --eval "
                rs.initiate({
                  _id: '{{ .Values.mongodb.replicaSet.name }}',
                  members: [
                    { _id: 0, host: '{{ include "mongodb.fullname" . }}-0.{{ include "mongodb.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:27017' },
                    { _id: 1, host: '{{ include "mongodb.fullname" . }}-1.{{ include "mongodb.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:27017' },
                    { _id: 2, host: '{{ include "mongodb.fullname" . }}-2.{{ include "mongodb.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:27017' }
                  ]
                })
              " --quiet
              
              echo "Replica set initialized"
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-secret
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-secret
                  key: root-password
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-secret
                  key: root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-secret
                  key: root-password
            - name: MONGO_INITDB_DATABASE
              value: {{ .Values.mongodb.auth.database }}
            {{- if .Values.mongodb.replicaSet.enabled }}
            - name: MONGO_REPLICA_SET_NAME
              value: {{ .Values.mongodb.replicaSet.name }}
            {{- end }}
          command:
            - mongod
            - --replSet={{ .Values.mongodb.replicaSet.name }}
            - --bind_ip_all
            - --port=27017
            {{- if .Values.mongodb.auth.enabled }}
            - --auth
            {{- end }}
            {{- if .Values.mongodb.keyFile.enabled }}
            - --keyFile=/etc/mongodb-keyfile/keyfile
            {{- end }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            {{- if .Values.mongodb.keyFile.enabled }}
            - name: mongodb-keyfile
              mountPath: /etc/mongodb-keyfile
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.mongodb.keyFile.enabled }}
        - name: mongodb-keyfile
          secret:
            secretName: {{ include "mongodb.fullname" . }}-keyfile
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
