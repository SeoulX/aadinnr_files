apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-mongodb-ingress
  namespace: mongodb
  labels:
    app: demo-mongodb
    service: database
    component: mongodb
    environment: staging
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "TCP"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: mongodb-staging.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo-mongodb-service
            port:
              number: 27017
