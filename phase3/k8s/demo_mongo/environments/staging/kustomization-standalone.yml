apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Direct Kubernetes manifests
resources:
- statefulset.yaml
- service.yaml
- ingress.yaml

# Namespace
namespace: mongodb

# Common labels
commonLabels:
  app: demo-mongodb
  service: database
  component: mongodb
  environment: staging

# ConfigMap for MongoDB configuration
configMapGenerator:
- name: demo-mongodb-config
  env: config.properties
  options:
    labels:
      service: database
      environment: staging
    disableNameSuffixHash: true

# Secret for MongoDB credentials and init script
secretGenerator:
- name: demo-mongodb-secret
  env: secret.properties
  files:
  - init-script.js
  options:
    disableNameSuffixHash: true
