apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-mongodb
  namespace: mongodb
  labels:
    app: demo-mongodb
    service: database
    component: mongodb
    environment: staging
spec:
  serviceName: demo-mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: demo-mongodb
      service: database
      environment: staging
  template:
    metadata:
      labels:
        app: demo-mongodb
        service: database
        environment: staging
    spec:
      containers:
      - name: demo-mongodb
        image: mongo:7.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: demo-mongodb-secret-staging
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-mongodb-secret-staging
              key: MONGO_INITDB_ROOT_PASSWORD
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: demo-mongodb-config-staging
              key: MONGO_INITDB_DATABASE
        livenessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: demo-mongodb-storage
          mountPath: /data/db
        - name: demo-mongodb-secret-staging
          mountPath: /docker-entrypoint-initdb.d/init-script.js
          subPath: init-script.js
      volumes:
      - name: demo-mongodb-secret-staging
        secret:
          secretName: demo-mongodb-secret-staging
  volumeClaimTemplates:
  - metadata:
      name: demo-mongodb-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
      storageClassName: standard
