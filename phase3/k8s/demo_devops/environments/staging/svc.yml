apiVersion: v1
kind: Service
metadata:
  name: demo-app-frontend-svc
  namespace: demo-apps
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app-frontend-staging
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      # nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-backend-svc
  namespace: demo-apps
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app-backend-staging
  type: NodePort
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30000

