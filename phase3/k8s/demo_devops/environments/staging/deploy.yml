apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-staging
  namespace: demo-apps
  labels:
    app: demo-app-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app-staging
  template:
    metadata:
      labels:
        app: demo-app-staging
    spec:
      containers:
        - name: demo-app
          image: aadinnr/demo_devops:backend-v1.0.1
          ports:
            - containerPort: 3000
