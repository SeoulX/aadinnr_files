apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app-ingress
  namespace: demo-apps
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: staging.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app-staging
                port:
                  number: 3000
