resources:
  - ../../../../global/base/app

nameSuffix: -staging

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: base-app
    patch: |-
      - op: replace
        path: /metadata/name
        value: demo-devops-ui
      - op: replace
        path: /spec/project
        value: demo-project
      - op: replace
        path: /metadata/annotations/argocd-image-updater.argoproj.io~1image-list
        value: base-image=aadinnr/demo_devops
      - op: replace
        path: /metadata/annotations/argocd-image-updater.argoproj.io~1base-image.allow-tags
        value: regexp:^frontend-v[0-9]+.[0-9]+.[0-9]+$
      - op: replace
        path: /metadata/annotations/argocd-image-updater.argoproj.io~1base-image.update-strategy
        value: name
      - op: replace
        path: /spec/destination/namespace
        value: staging
      - op: replace
        path: /spec/source/path
        value: phase3/k8s/demo_devops/ui/environments/staging