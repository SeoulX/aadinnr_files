<!DOCTYPE html>
<html>
<head>
  <title>Multi-Tier App</title>
</head>
<body>
  <h1>Hello from Frontend (Nginx)!</h1>
  <p>API Call → <span id="api"></span></p>
  <script>
    fetch("http://localhost:5000/api/hello")
      .then(res => res.json())
      .then(data => document.getElementById("api").innerText = data.message)
  </script>
</body>
</html>
