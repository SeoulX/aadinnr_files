apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: demo-rs
  namespace: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo-container
          image: nginx:latest
          ports:
            - containerPort: 80
