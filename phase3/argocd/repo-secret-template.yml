# Template for Git repository SSH credentials
# Replace the values below with your actual repository details

apiVersion: v1
data:
  enableLfs: ZmFsc2U=  # base64 for "false"
  insecure: ZmFsc2U=   # base64 for "false"
  # Base64 encode your SSH private key: cat ~/.ssh/id_rsa | base64 -w 0
  sshPrivateKey: <BASE64_ENCODED_SSH_PRIVATE_KEY>
  # Base64 encode your Git repository URL: echo -n "git@github.com:username/repo.git" | base64
  url: <BASE64_ENCODED_GIT_URL>
kind: Secret
metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: |
      {"apiVersion":"v1","data":{"enableLfs":"ZmFsc2U=","insecure":"ZmFsc2U=","sshPrivateKey":"<BASE64_ENCODED_SSH_PRIVATE_KEY>","url":"<BASE64_ENCODED_GIT_URL>"},"kind":"Secret","metadata":{"annotations":{},"labels":{"argocd.argoproj.io/secret-type":"repository"},"name":"your-repo-name","namespace":"argocd"},"type":"Opaque"}
  labels:
    argocd.argoproj.io/secret-type: repository
  name: your-repo-name  # Change this to your repository name
  namespace: argocd
type: Opaque

# To generate your SSH key and URL:
# 1. Generate SSH key: ssh-keygen -t rsa -b 4096 -C "your-email@example.com"
# 2. Add public key to your Git provider (GitHub/GitLab/Bitbucket)
# 3. Encode private key: cat ~/.ssh/id_rsa | base64 -w 0
# 4. Encode Git URL: echo -n "git@github.com:username/repo.git" | base64
