# Template for ArgoCD Image Updater configuration
# Update the registry configuration with your credentials

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
  annotations:
    meta.helm.sh/release-name: image-updater
    meta.helm.sh/release-namespace: argocd
  labels:
    app.kubernetes.io/instance: image-updater
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/version: v0.12.2
    helm.sh/chart: argocd-image-updater-0.9.1
data:
  registries.conf: |
    registries:
      - name: Docker Hub
        api_url: https://registry-1.docker.io
        default: true
        # Reference to your Docker Hub secret
        credentials: secret:argocd/dockerhub#my-token
        limit: 20
        ping: true
      # Add more registries as needed
      # - name: GitHub Container Registry
      #   api_url: https://ghcr.io
      #   credentials: secret:argocd/ghcr#token
      #   limit: 20
      #   ping: true
      # - name: GitLab Container Registry
      #   api_url: https://registry.gitlab.com
      #   credentials: secret:argocd/gitlab#token
      #   limit: 20
      #   ping: true
  argocd.grpc_web: "true"
  argocd.insecure: "false"
  argocd.plaintext: "false"
  kube.events: "false"
  log.level: info
